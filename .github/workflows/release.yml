name: Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  windows:
    name: Windows installer (x64)
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install dependencies
        run: npm ci

      - name: Fetch vendor binaries (ffmpeg, cloudflared, WinSW)
        shell: bash
        run: bash scripts/fetch-vendor.sh

      - name: Put the vendored FFmpeg on PATH (runner images no longer ship it)
        shell: bash
        run: echo "$GITHUB_WORKSPACE/resources/ffmpeg" >> "$GITHUB_PATH"

      - name: Run server smoke test (against the FFmpeg that ships in the installer)
        shell: bash
        run: node test/smoke.js
        env:
          HEARTH_TEST_PORT: 7341

      - name: Build Windows installer
        run: npx electron-builder --win nsis --x64 --publish never
        env:
          # Code signing is optional; set these repository secrets to sign releases.
          WIN_CSC_LINK: ${{ secrets.WIN_CSC_LINK }}
          WIN_CSC_KEY_PASSWORD: ${{ secrets.WIN_CSC_KEY_PASSWORD }}

      - name: Compute SHA256 checksums
        shell: bash
        run: |
          cd dist
          sha256sum *.exe | grep -v '__uninstaller' > SHA256SUMS.txt
          cat SHA256SUMS.txt

      - name: Upload installer artifact
        uses: actions/upload-artifact@v4
        with:
          name: Hearth-Windows-x64
          path: |
            dist/*.exe
            !dist/*__uninstaller*
            dist/SHA256SUMS.txt
          if-no-files-found: error

      - name: Attach installer to GitHub release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: |
            dist/*.exe
            !dist/*__uninstaller*
            dist/SHA256SUMS.txt
          body_path: RELEASE_NOTES.md
          fail_on_unmatched_files: true
